pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc,css,astro}"
      run: bun run lint:fix --no-error-on-unmatched-pattern {staged_files} && bun run format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    types:
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    check:
      run: bun run format:check && bun run lint
    types:
      run: bun run typecheck
